[package]
name = "rldyour-sysinfod"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
description = "Resource-frugal system metrics daemon for Linux, macOS, and Windows"
repository = "https://github.com/NDDev-OpenNetwork/rldyour-sysinfo"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = { version = "0.13.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Pinned to smc 0.2.4's `four-char-code ^0.0.5`: `smc::SMC::keys()` and
# `temperature()` expose this type in their public API, so the daemon must
# share smc's major version. Revisit when smc upgrades.
four-char-code = "=0.0.5"
iokit = "0.6.0"
smc = "0.2.4"
core-foundation-sys = "0.8.7"

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["component", "disk", "network", "system"] }
uds_windows = "1.2.1"

[features]
default = ["nvidia"]
nvidia = ["dep:nvml-wrapper"]

# Size and residency win over throughput: the whole workload is a handful of
# short reads every five seconds, so the smallest possible image is the right
# trade. `panic = "abort"` also removes unwinding tables and makes a failure a
# clean restart under systemd rather than a half-live process.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
