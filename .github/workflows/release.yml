name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag version
        shell: bash
        run: |
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' daemon/Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${manifest_version}"
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-bin
      - run: ./scripts/check-extension.sh
      - run: cargo test --all-features --locked --manifest-path daemon/Cargo.toml
      - run: cargo build --release --all-features --locked --manifest-path daemon/Cargo.toml
      - name: Package Linux
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stage/systemd
          install -m755 daemon/target/release/rldyour-sysinfod dist/stage/rldyour-sysinfod
          install -m644 daemon/systemd/* dist/stage/systemd/
          install -m644 LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md dist/stage/
          tar -czf "dist/rldyour-sysinfo-${version}-x86_64-linux.tar.gz" -C dist/stage .
          cp -r extension dist/extension
          rm -rf dist/extension/tests
          glib-compile-schemas dist/extension/schemas
          (cd dist/extension && zip -qr "../rldyour-sysinfo-gnome-${version}.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/rldyour-sysinfo-*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked --no-default-features --manifest-path daemon/Cargo.toml
      - run: cargo build --release --locked --no-default-features --manifest-path daemon/Cargo.toml
      - name: Package macOS
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          arch="$(uname -m)"
          app="dist/stage/prebuilt/rldyour-sysinfo.app"
          mkdir -p "${app}/Contents/MacOS" dist/stage/prebuilt dist/stage/macos
          swiftc -O -framework AppKit macos/RldyourSysinfo.swift -o "${app}/Contents/MacOS/rldyour-sysinfo"
          plutil -create xml1 "${app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string rldyour-sysinfo' "${app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.nddev-opennetwork.rldyour-sysinfo' "${app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string rldyour-sysinfo' "${app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :LSUIElement bool true' "${app}/Contents/Info.plist"
          codesign --force --sign - "${app}"
          install -m755 daemon/target/release/rldyour-sysinfod dist/stage/prebuilt/
          install -m644 macos/*.plist dist/stage/macos/
          install -m755 install-macos.sh uninstall-macos.sh dist/stage/
          install -m644 LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md dist/stage/
          (cd dist/stage && zip -qry "../rldyour-sysinfo-${version}-${arch}-macos.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: dist/rldyour-sysinfo-*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked --all-features --manifest-path daemon/Cargo.toml
      - run: cargo build --release --locked --all-features --manifest-path daemon/Cargo.toml
      - name: Package Windows
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item daemon/target/release/rldyour-sysinfod.exe, install-windows.ps1, uninstall-windows.ps1, LICENSE, CHANGELOG.md, THIRD_PARTY_NOTICES.md dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/rldyour-sysinfo-$version-x86_64-windows.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/rldyour-sysinfo-*.zip

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install build twine
      - run: python -m build python
      - run: python -m twine check python/dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python
          path: python/dist/*

  publish:
    needs: [linux, macos, windows, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -- ./* > SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes -- dist/*
