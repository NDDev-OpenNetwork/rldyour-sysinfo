name: Publish APT repository

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified release tag to publish
        required: true
        type: string
  # This workflow runs from the default branch, which the github-pages
  # environment allows. A tag push itself is intentionally not a deployable
  # environment ref. Build only the successfully released commit below.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve an existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "${RELEASE_TAG}" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease)' | grep -qx false
          printf 'tag=%s\n' "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
      - name: Verify the released source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          ./scripts/check-version.sh "${RELEASE_TAG}"
          if [[ -n "${EXPECTED_COMMIT}" ]]; then
            test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"
          fi
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y apt-utils dpkg-dev
      - name: Build daemon
        run: cargo build --release --all-features --locked --manifest-path daemon/Cargo.toml
      - name: Build signed repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p site/apt/pool/main/r/rldyour-sysinfo site/apt/dists/stable/main/binary-amd64
          scripts/build-deb.sh daemon/target/release/rldyour-sysinfod site/apt/pool/main/r/rldyour-sysinfo
          cd site/apt
          dpkg-scanpackages --arch amd64 pool > dists/stable/main/binary-amd64/Packages
          gzip -9 -k dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="NDDev OpenNetwork" \
            -o APT::FTPArchive::Release::Label="rldyour-sysinfo" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            release dists/stable > dists/stable/Release
          printf '%s' "${APT_SIGNING_KEY}" | gpg --batch --import
          gpg --batch --yes --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release
          install -m644 ../../packaging/apt/rldyour-sysinfo.asc rldyour-sysinfo.asc
      - name: Verify APT installation
        run: |
          sudo install -m644 packaging/apt/rldyour-sysinfo.asc /usr/share/keyrings/rldyour-sysinfo.asc
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rldyour-sysinfo.asc] file:${PWD}/site/apt stable main" | sudo tee /etc/apt/sources.list.d/rldyour-sysinfo.list
          sudo apt-get update
          sudo apt-get install -y rldyour-sysinfo
          test -x /usr/bin/rldyour-sysinfod
          /usr/bin/rldyour-sysinfod --version
          grep -qx 'ExecStart=/usr/bin/rldyour-sysinfod' /usr/lib/systemd/user/rldyour-sysinfod.service
          # The maintainer scripts must have enabled the socket for every
          # login session — the package is useless until it exists.
          test -L /usr/lib/systemd/user/sockets.target.wants/rldyour-sysinfod.socket
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy APT repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
