name: Publish package registries

on:
  workflow_dispatch:
    inputs:
      cargo:
        description: Publish the Rust daemon to crates.io
        type: boolean
        default: false
      pypi:
        description: Publish the Python client to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cargo:
    if: inputs.cargo
    runs-on: ubuntu-latest
    environment: cargo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate with crates.io
        id: cargo-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: cargo publish --locked --manifest-path daemon/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cargo-auth.outputs.token }}

  pypi:
    if: inputs.pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install build && python -m build python
      - name: Publish with PyPI trusted publishing
        run: |
          python -m pip install uv==0.11.21
          uv publish --trusted-publishing always python/dist/*
