name: Publish package registries

on:
  workflow_dispatch:
    inputs:
      cargo:
        description: Publish the Rust daemon to crates.io
        type: boolean
        default: false
      pypi:
        description: Publish the Python client to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cargo:
    if: inputs.cargo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo publish --locked --manifest-path daemon/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    if: inputs.pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install build && python -m build python
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: python/dist/
