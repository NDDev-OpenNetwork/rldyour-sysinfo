name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisory drift and action rot happen without pushes too.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check --manifest-path daemon/Cargo.toml
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
      - run: shellcheck scripts/*.sh install.sh uninstall.sh install-macos.sh uninstall-macos.sh packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm
      - run: ./scripts/check-version.sh

  daemon:
    name: Daemon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ runner.os }}-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo build --release --locked --no-default-features

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 check --locked --manifest-path daemon/Cargo.toml

  linux-nvidia:
    name: Linux with NVIDIA support
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo build --release --all-features --locked

  windows-nvidia:
    name: Windows with NVIDIA support
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo build --release --all-features --locked
      - name: Check installer syntax
        shell: pwsh
        working-directory: .
        run: |
          foreach ($file in "install-windows.ps1", "uninstall-windows.ps1") {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

  e2e:
    name: End to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The ambient runner `python` is not deterministic — on Windows it can be
      # a build without AF_UNIX, which the wire protocol depends on.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: cargo build --release --locked --manifest-path daemon/Cargo.toml
      - name: Serve and read the protocol (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          ./daemon/target/release/rldyour-sysinfod &
          daemon_pid=$!
          python -m venv /tmp/e2e
          /tmp/e2e/bin/pip install ./python
          sleep 1
          /tmp/e2e/bin/python scripts/e2e-sample.py
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs
          (cd extension && gjs -m tests/smoke.js)
          kill "${daemon_pid}"
      - name: Serve and read the protocol (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          ./daemon/target/release/rldyour-sysinfod &
          daemon_pid=$!
          python3 -m venv /tmp/e2e
          /tmp/e2e/bin/pip install ./python
          sleep 1
          /tmp/e2e/bin/python scripts/e2e-sample.py
          kill "${daemon_pid}"
      - name: Serve and read the protocol (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $daemon = Start-Process -PassThru -WindowStyle Hidden daemon/target/release/rldyour-sysinfod.exe
          try {
            python -m venv "$env:TEMP\e2e"
            & "$env:TEMP\e2e\Scripts\python.exe" -m pip install ./python
            Start-Sleep -Seconds 1
            & "$env:TEMP\e2e\Scripts\python.exe" scripts/e2e-sample.py
          } finally {
            Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue
          }

  platform-clients:
    name: Platform clients
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swiftc -O -framework AppKit macos/RldyourSysinfo.swift -o /tmp/rldyour-sysinfo-app
      - run: plutil -lint macos/*.plist

  extension:
    name: GNOME extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-bin
      - run: ./scripts/check-extension.sh

  python-client:
    name: Python client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run the test suite
        shell: bash
        run: |
          python -m venv /tmp/pyclient
          # Windows venvs use Scripts/ instead of bin/.
          V=/tmp/pyclient/bin; [ -d /tmp/pyclient/Scripts ] && V=/tmp/pyclient/Scripts
          "$V/pip" install pytest ./python
          "$V/pytest" python/tests
      - if: runner.os == 'Linux'
        run: |
          python -m venv /tmp/pybuild
          /tmp/pybuild/bin/pip install build
          /tmp/pybuild/bin/python -m build python

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: daemon
