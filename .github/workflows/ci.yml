name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisory drift and action rot happen without pushes too.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check --manifest-path daemon/Cargo.toml
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck init-system-helpers
      - run: shellcheck scripts/*.sh install.sh uninstall.sh install-macos.sh uninstall-macos.sh packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm
      - run: ./scripts/check-version.sh
      - run: ./scripts/check-deb-lifecycle.sh

  daemon:
    name: Daemon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-26-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ runner.os }}-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo build --release --locked --no-default-features

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.95 --profile minimal
      - run: cargo +1.95 check --locked --manifest-path daemon/Cargo.toml

  linux-nvidia:
    name: Linux with NVIDIA support
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo build --release --all-features --locked

  windows-nvidia:
    name: Windows with NVIDIA support
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo build --release --all-features --locked
      - name: Check installer syntax
        shell: pwsh
        working-directory: .
        run: |
          foreach ($file in "install-windows.ps1", "uninstall-windows.ps1", "scripts/e2e-sample.ps1") {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

  e2e:
    name: End to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-26-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Windows exercises the socket through .NET instead — CPython does not
      # build AF_UNIX there. Elsewhere a pinned interpreter keeps the venv
      # deterministic.
      - if: runner.os != 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.17'
      - run: cargo build --release --locked --manifest-path daemon/Cargo.toml
      - name: Serve and read the protocol (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          ./daemon/target/release/rldyour-sysinfod &
          daemon_pid=$!
          sleep 1
          PYTHONPATH=python/src uv run --no-project python scripts/e2e-sample.py
          PYTHONPATH=python/src uv run --no-project python scripts/runtime-check.py --socket "${XDG_RUNTIME_DIR}/rldyour-sysinfo.sock"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs
          (cd extension && gjs -m tests/smoke.js)
          test_runtime="$(mktemp -d)"
          XDG_RUNTIME_DIR="${test_runtime}" gjs -m extension/tests/client.js
          rmdir "${test_runtime}"
          kill "${daemon_pid}"
      - name: Serve and read the protocol (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          ./daemon/target/release/rldyour-sysinfod &
          daemon_pid=$!
          sleep 1
          PYTHONPATH=python/src uv run --no-project python scripts/e2e-sample.py
          PYTHONPATH=python/src uv run --no-project python scripts/runtime-check.py --socket "${HOME}/Library/Application Support/rldyour-sysinfo/rldyour-sysinfo.sock"
          swiftc -swift-version 6 -parse-as-library -warnings-as-errors macos/Sample.swift macos/SocketClient.swift macos/tests/SocketTests.swift -o /tmp/sysinfo-socket-tests
          /tmp/sysinfo-socket-tests "${HOME}/Library/Application Support/rldyour-sysinfo/rldyour-sysinfo.sock"
          kill "${daemon_pid}"
      - name: Serve and read the protocol (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $daemon = Start-Process -PassThru -WindowStyle Hidden daemon/target/release/rldyour-sysinfod.exe
          try {
            Start-Sleep -Seconds 1
            ./scripts/e2e-sample.ps1
          } finally {
            Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Explain a macOS daemon crash
        if: failure() && runner.os == 'macOS'
        run: |
          python3 - <<'PY_CRASH'
          import json, pathlib
          for path in (pathlib.Path.home() / 'Library/Logs/DiagnosticReports').glob('rldyour-sysinfod*.ips'):
              lines = path.read_text().split('\n', 1)
              try:
                  report = json.loads(lines[1])
              except (ValueError, IndexError):
                  continue
              print(json.dumps({key: report.get(key) for key in ('exception', 'termination', 'asi', 'faultingThread')}))
              for thread in report.get('threads', []):
                  if thread.get('triggered'):
                      print(json.dumps(thread.get('frames', [])[:20]))
          PY_CRASH

  platform-clients:
    name: Platform clients (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swiftc -target "$(uname -m)-apple-macosx12.0" -swift-version 6 -parse-as-library -warnings-as-errors -O -framework AppKit macos/*.swift -o /tmp/rldyour-sysinfo-app
      - run: |
          swiftc -swift-version 6 -parse-as-library -warnings-as-errors macos/Sample.swift macos/tests/ProtocolTests.swift -o /tmp/sysinfo-protocol-tests
          /tmp/sysinfo-protocol-tests
      - run: plutil -lint macos/*.plist

  extension:
    name: GNOME extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-bin
      - run: ./scripts/check-extension.sh

  python-client:
    name: Python client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.17'
      - name: Run the test suite
        shell: bash
        run: PYTHONPATH=python/src uv run --no-project --with pytest==9.1.1 pytest python/tests
      - if: runner.os == 'Linux'
        run: uv build python

  debian-package:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y dpkg-dev
      - run: |
          cargo build --release --locked --manifest-path daemon/Cargo.toml
          ./scripts/build-deb.sh daemon/target/release/rldyour-sysinfod /tmp/sysinfo-deb
          dpkg-deb -x /tmp/sysinfo-deb/*.deb /tmp/sysinfo-unpack
          test "$(stat -c '%a' /tmp/sysinfo-unpack)" = 755
          grep -qx 'ExecStart=/usr/bin/rldyour-sysinfod' /tmp/sysinfo-unpack/usr/lib/systemd/user/rldyour-sysinfod.service
          dpkg-deb -f /tmp/sysinfo-deb/*.deb Depends | grep -q 'libc6'
          /tmp/sysinfo-unpack/usr/bin/rldyour-sysinfod --version
          sudo dpkg -i /tmp/sysinfo-deb/*.deb
          systemctl --global is-enabled rldyour-sysinfod.socket

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install cargo-audit --version 0.22.1 --locked
      - run: cargo audit
        working-directory: daemon
