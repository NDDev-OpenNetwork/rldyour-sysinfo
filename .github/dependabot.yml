version: 2
updates:
  - package-ecosystem: cargo
    directory: /daemon
    schedule:
      interval: weekly
    ignore:
      # four-char-code is bound to smc 0.2.4's ^0.0.5 API (see daemon/Cargo.toml).
      - dependency-name: "four-char-code"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
